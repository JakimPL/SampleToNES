MEMORY {
    ZP:  start = $0000, size = $0100, type = rw, define = yes;
    PRG: start = $8000, size = $8000, type = ro, define = yes, file = %O, fill = no;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CODE:     load = PRG, type = ro;
    SONG:     load = PRG, type = ro, optional = yes;
}
