name: light

colors:
  # surfaces and neutrals
  ground: "#e6e6ea"
  tab_strip: "#dcdce2"
  recess: "#dedee4"
  surface: "#f5f5f8"
  surface_alt: "#fdfdff"
  surface_accent: "#ede6fa"
  menu: "#e0e5f0"
  status_bar: "#e0e5f0"
  popup: "#fdfdff"
  frame: "#ffffff"
  frame_hovered: "#eff0f5"
  frame_active: "#e5e6f0"
  border: "#c2c2cc"
  separator: "#b4b4c2"
  plot_background: "#f7f7fa"
  well: "#e6ecf6"

  # tables
  table_header: "#dcd6ec"
  table_row: "#f3f3f7"
  table_row_alt: "#e9e9f0"
  table_border: "#c6c2d4"

  # cool secondary (functional chrome: input focus, secondary emphasis)
  cool: "#2f6fd0"
  cool_hover: "#1f5cb8"
  cool_active: "#17488f"
  cool_muted: "#b7cae9"

  # accent
  accent: "#6b3fb0"
  accent_hover: "#7f52c4"
  accent_active: "#55308c"
  accent_muted: "#d5c4ee"
  on_accent: "#ffffff"

  # buttons
  primary: "#7a55b8"
  primary_hover: "#8a67c6"
  primary_active: "#644497"
  primary_muted: "#c1bad0"
  on_primary: "#ffffff"

  secondary: "#dee2ea"
  secondary_hover: "#ced5e1"
  secondary_active: "#bcc5d4"
  secondary_disabled: "#ebebf0"

  # danger (destructive actions: cancel, abort)
  danger: "#bf4646"
  danger_hover: "#d05a5a"
  danger_active: "#9b3737"
  on_danger: "#ffffff"

  # dialog windows (elevated surface + accent border/title)
  dialog_surface: "#f2f2f7"
  dialog_title: "#d7deee"

  # channels: pulses orange, triangle blue, noise grey
  channel_pulse1: "#c25a12"
  channel_pulse2: "#96790a"
  channel_triangle: "#2a6ba4"
  channel_noise: "#66646e"
  channel_pulse1_soft: "#9c6f45"
  channel_pulse2_soft: "#847540"
  channel_triangle_soft: "#557c9a"
  channel_noise_soft: "#8a8890"

  # tabs
  tab: "#dde0e9"
  tab_hovered: "#cad3e5"
  tab_active: "#b6c4df"

  # selection (tree, list, menu highlight)
  selection: "#dbd2ee"
  selection_hovered: "#ccc0e5"
  selection_active: "#bcaddc"

  # scrollbar
  scrollbar_hovered: "#bebec9"

  # buttons
  button: "#ccd4e5"
  button_hovered: "#bcc7dd"
  button_active: "#aabad5"
  button_disabled: "#e2e2e8"

  # player
  player_surface: "#e2e8f4"
  player_border: "#3d7fc4"
  player_button: "#d2daed"
  player_button_hovered: "#c0cde5"
  player_button_active: "#adbedc"
  player_button_disabled: "#e6eaf3"

  # text
  text: "#1e1e24"
  text_muted: "#5c5c68"
  text_disabled: "#92929c"
  text_trace: "#4a4a4a"

  # emphasis and overlays
  # contrast: the strongest foreground the surfaces carry
  # overlay: tinted at a fraction to lift a row or region off its background
  contrast: "#16161c"
  overlay: "#000000"
  transparent: "#00000000"
  border_strong: "#a6a6b2"
  input_invalid: "#c0504a48"
  input_warning: "#c0884a48"

  # plot lines
  plot_zero_line: "#909098"

  # file-tree nodes
  file_wave: "#0d6ea8"
  file_library: "#1c7a34"
  file_reconstruction: "#4a4ab4"
  file_muted: "#7c7c86"

  # favourites
  favorite: "#b07d0a"
  favorite_child: "#8d7a45"

  # instruction-library nodes
  library_generator: "#2c6e3c"
  library_group: "#1c6a70"
  library_instruction: "#4c4c54"
  library_root: "#33333a"

  # layout: content text
  text_default: "#26262c"
  text_inactive: "#84848e"
  text_error: "#c03030"
  text_highlight: "#9a6a00"

  # layout: flat control buttons
  button_flat: "#dcdce4"
  button_flat_active: "#b8b8c8"
  button_flat_hovered: "#cbcbda"
  button_flat_light: "#d2d2e0"

  # layout: background fills
  background_default: "#f0f0f2"
  background_dark: "#e2e2e6"
  background_light: "#fafafc"
  background_menu: "#e8e8ec"
  background_invalid: "#c0202038"

  # layout: properties table
  properties_header: "#dbe0ec"
  properties_row: "#f4f5f8"
  properties_row_alt: "#eaebf1"
  properties_border: "#c3c8d6"
  properties_label: "#3f5480"
  properties_value: "#2c3140"

  # layout: path links
  path_link: "#1f5fd0"
  path_link_hover: "#0d3f9c"

  # layout: section headers
  header_library: "#2c7a44"
  header_reconstruction: "#6b3fb0"

  # layout: instruction features
  feature_volume: "#1f8038"
  feature_arpeggio: "#c05a18"
  feature_pitch: "#0d6ea8"
  feature_duty_cycle: "#96700a"

  # layout: caret overlay
  caret_fill: "#3a3ac060"
  caret_border: "#2a5fb0ff"

  # layout: graphs and waveforms
  graph_bar: "#1c72ac"
  waveform_sample: "#1c72ac"
  waveform_reconstruction: "#b07d0a"
  waveform_overlay: "#00000018"
  spectrum_dim: "#f7f7fa"

  # layout: tracker cursor and playback
  pattern_highlight: "#00000018"
  cell_cursor: "#2a7fd090"
  cursor_row: "#0000000f"
  playback_row: "#1f903838"

  # layout: order table
  order_label: "#dbe0ec"
  order_master: "#1c8cc018"
  order_master_divider: "#1c8cc028"
  order_column_current: "#00000014"
  order_column_playing: "#1f903828"

  # layout: sample column
  sample_column: "#1c8cc022"
  sample_divider: "#1c8cc028"

  # layout: muted channel column
  channel_muted: "#9a9aa614"

  # layout: history detail
  history_future: "#8c8c94ff"
  history_channel: "#1f5fb0ff"
  history_value: "#33333aff"
  history_separator: "#9a9aa2ff"

  # layout: tracker text (instrument and sample share the reference yellow)
  tracker_reference: "#8a6a00ff"
  tracker_transpose: "#4c4c54ff"
  tracker_volume: "#1f8038ff"
  tracker_frame: "#0d6ea8ff"
  tracker_row: "#70707aff"
  tracker_order: "#3a4055ff"
