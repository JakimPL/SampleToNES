window:
  width: 1280
  height: 800
  position_x: 200
  position_y: 200
  fullscreen: false

panel_gap: 8

columns:
  side:
    width: 360
    height: -1
  instructions_right:
    width: 360
    height: -1
  reconstructions_right:
    width: 420
    height: -1
  sequencer_right:
    width: 360
    height: -1

status_bar:
  height: 32
  reserved_margin: 14
  frame_rounding: 0
  frame_padding: [0, 0]

dialogs:
  default:
    width: 420
    height: 100
  error:
    width: 600
    height: 120
  recovery:
    width: 640
    height: 120
  file:
    width: 720
    height: 400
  confirmation:
    height: 130
  text_input:
    height: 104
  traceback:
    width: 0
    height: 400

inputs:
  default_width: -8
  search_width: -80
  label_width: 145

buttons:
  copy_width: 80
  search_width: -1
  int_width: 30
  frame_rounding: 6
  frame_padding: [10, 4]

tables:
  label_width: 130
  cell_padding: [8, 4]
  frame_rounding: 4

pitch_stepper:
  label_width: 160
  value_width: 28
  button_column_width: 32
  button_width: 30
  hold_delay: 0.075
  commit_delay: 12

menu:
  fps_text_offset: 10

caret:
  offset: 3
  width_padding: 2
  fill: .caret_fill
  border: .caret_border

section_header:
  glyph:
    indent: 4
    width: 20
  chevron_offset: 8

collapse:
  header_bar_height: 35
  rail_width: 50
  rail_title_gap: 6

colors:
  text:
    white: .white
    default: .text_default
    disabled: .text_inactive
    error: .text_error
    highlight: .text_highlight
    traceback: .text_trace
  files:
    wave: .file_wave
    library: .file_library
    reconstruction: .file_reconstruction
    directory_not_expanded: .file_muted
  favorites:
    default: .favorite
    child: .favorite_child
  buttons:
    default: .button_flat
    active: .button_flat_active
    hovered: .button_flat_hovered
    light: .button_flat_light
  backgrounds:
    default: .background_default
    dark: .background_dark
    light: .background_light
    menu: .background_menu
    input_invalid: .background_invalid
  tables:
    header: .properties_header
    row: .properties_row
    row_alternative: .properties_row_alt
    border: .properties_border
    label: .properties_label
    value: .properties_value
  paths:
    default: .path_link
    hover: .path_link_hover
  headers:
    library: .header_library
    reconstruction: .header_reconstruction
  features:
    volume: .feature_volume
    arpeggio: .feature_arpeggio
    pitch: .feature_pitch
    duty_cycle: .feature_duty_cycle
