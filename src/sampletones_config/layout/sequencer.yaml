cell_padding: [3, 4]

order:
  height: 185
  position_column_width: 40
  master_divider_height: 4

table_cells:
  row: 30
  sample: 80
  divider: 4
  generator: 80
  instrument:
    id: 40
    name: 1
    loop: 40

tempo:
  min: 32
  max: 255
  default: 150

speed:
  min: 1
  max: 31
  default: 6

tracker:
  rows: 64
  row_height: 20
  page_size: 16
  channel_column_tint: 0.09
