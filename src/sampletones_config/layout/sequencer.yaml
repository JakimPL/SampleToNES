samples_panel_width: 360
cell_padding: [3, 4]

order:
  height: 185
  position_column_width: 40
  master_divider_height: 4

table_cells:
  row: 30
  sample: 80
  divider: 4
  generator: 80
  instrument_id: 40
  instrument_name: 1
  instrument_loop: 40

tempo:
  min: 32
  max: 255
  default: 150

speed:
  min: 1
  max: 31
  default: 6

tracker:
  rows: 64
  row_height: 20
  page_size: 16
  subcolumn_widths:
    instrument: 26
    transpose: 30
    volume: 18

history:
  height: 260
  margin: 5
  selectable_column_weight: 0.0001

colors:
  pattern_highlight: "#ffffff40"
  cell_cursor: "#4488ff60"
  cursor_row: "#ffffff18"
  sample_column: "#22ccff18"
  sample_divider: "#22ccff24"
  order_label: "#2d3241"
  order_master: "#22ccff18"
  order_master_divider: "#22ccff24"
  order_column: "#1e2028"
  order_column_alternate: "#262834"
  order_column_current: "#ffffff20"
  order_column_playing: "#64dc6430"
  playback_row: "#64dc6440"
  history_future: "#808080ff"
  history_roles:
    channel: "#88bbffff"
    value: "#d0d0d0ff"
    separator: "#707070ff"
  text:
    instrument: "#e0c860ff"
    transpose: "#a0a0a0ff"
    volume: "#64dc64ff"
    sample: "#e0c860ff"
    frame: "#22ccffff"
    row: "#a0a0a0ff"
    order: "#c8d0e0ff"
