  pattern_highlight: "#ffffff40"
  cell_cursor: "#66bbffa0"
  cursor_row: "#ffffff18"
  playback_row: "#64dc6440"
  label: "#ffffff"
  order:
    label: "#2d3241"
    master: "#22ccff18"
    master_divider: "#22ccff24"
    column_current: "#ffffff20"
    column_playing: "#64dc6430"
  sample:
    column: "#22ccff2c"
    divider: "#22ccff24"
  history:
    future: "#808080ff"
    roles:
      channel: "#88bbffff"
      value: "#d0d0d0ff"
      separator: "#707070ff"
  text:
    instrument: "#e0c860ff"
    transpose: "#c0c0c0ff"
    volume: "#64dc64ff"
    sample: "#e0c860ff"
    frame: "#22ccffff"
    row: "#a0a0a0ff"
