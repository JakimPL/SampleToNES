cell_padding: [3, 4]

order:
  height: 185
  position_column_width: 40
  master_divider_height: 4

table_cells:
  row: 30
  sample: 80
  divider: 4
  generator: 80
  instrument:
    id: 40
    name: 1
    loop: 40

tempo:
  min: 32
  max: 255
  default: 150

speed:
  min: 1
  max: 31
  default: 6

tracker:
  rows: 64
  row_height: 20
  page_size: 16
  channel_column_tint: 0.09
  subcolumn_widths:
    instrument: 26
    transpose: 30
    volume: 18

history:
  height: 260
  selectable_column_weight: 0.0001
  max_rendered_entries: 100

colors:
  pattern_highlight: .pattern_highlight
  cell_cursor: .cell_cursor
  cursor_row: .cursor_row
  playback_row: .playback_row
  label: .white
  order:
    label: .order_label
    master: .order_master
    master_divider: .order_master_divider
    column_current: .order_column_current
    column_playing: .order_column_playing
  sample:
    column: .sample_column
    divider: .sample_divider
  history:
    future: .history_future
    roles:
      channel: .history_channel
      value: .history_value
      separator: .history_separator
  text:
    instrument: .tracker_reference
    transpose: .tracker_transpose
    volume: .tracker_volume
    sample: .tracker_reference
    frame: .tracker_frame
    row: .tracker_row
    order: .tracker_order
  channels:
    pulse1: .channel_pulse1
    pulse2: .channel_pulse2
    triangle: .channel_triangle
    noise: .channel_noise
