name: accent_button
tag: global.theme.accent_button

components:
  - item_type: Button
    entries:
      - type: color
        key: Button
        value: .accent
      - type: color
        key: ButtonHovered
        value: .accent_hover
      - type: color
        key: ButtonActive
        value: .accent_active
      - type: color
        key: Text
        value: .on_accent
