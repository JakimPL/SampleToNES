name: status
tag: global.theme.status

components:
  - item_type: All
    entries:
      - type: color
        key: Text
        value: .text
      - type: color
        key: TextDisabled
        value: .text
      - type: style
        key: ButtonTextAlign
        x: 0.0
      - type: color
        key: Button
        value: .menu
      - type: color
        key: ButtonHovered
        value: .menu
      - type: color
        key: ButtonActive
        value: .menu
      - type: color
        key: FrameBg
        value: .menu
      - type: color
        key: WindowBg
        value: .menu
  - item_type: Button
    entries:
      - type: color
        key: Text
        value: .text
      - type: color
        key: TextDisabled
        value: .text
  - item_type: Button
    enabled: false
    entries:
      - type: color
        key: Text
        value: .text
      - type: color
        key: TextDisabled
        value: .text
      - type: style
        key: ButtonTextAlign
        x: 0.0
      - type: style
        key: FrameRounding
        x: 0
      - type: style
        key: FramePadding
        x: 0
        y: 0
