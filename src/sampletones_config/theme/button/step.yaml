name: step_button
tag: global.theme.step_button

components:
  - item_type: Button
    entries:
      - type: color
        key: Button
        value: .control
      - type: color
        key: ButtonHovered
        value: .control_hovered
      - type: color
        key: ButtonActive
        value: .control_active
      - type: color
        key: Text
        value: .text
