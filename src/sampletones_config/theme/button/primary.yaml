name: primary_button
tag: global.theme.primary_button

components:
  - item_type: Button
    entries:
      - type: color
        key: Button
        value: .primary
      - type: color
        key: ButtonHovered
        value: .primary_hover
      - type: color
        key: ButtonActive
        value: .primary_active
      - type: color
        key: Text
        value: .on_primary
