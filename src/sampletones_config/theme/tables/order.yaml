name: table_order
tag: sequencer.theme.table_order

components:
  - item_type: Table
    entries:
      - type: color
        key: HeaderHovered
        value: .overlay/0.25
      - type: color
        key: HeaderActive
        value: .transparent
  - item_type: Selectable
    entries:
      - type: style
        key: ItemSpacing
        x: 0
        y: 0
      - type: style
        key: SelectableTextAlign
        x: 0
        y: 0.5
      - type: color
        key: Header
        value: .block_selection
