MEMORY {
    ZP:  start = $0000, size = $0100,       type = rw, define = yes;
    PRG: start = $8000, size = %S - $8000,  type = ro, define = yes, file = %O, fill = yes, fillval = $FF;
    TOP: start = %S,    size = $10000 - %S, type = ro, define = yes, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp, define = yes;
    PLAYERZP: load = ZP,  type = zp, optional = yes;
    CODE:     load = PRG, type = ro;
    SONG:     load = PRG, type = ro, optional = yes;
    PROGRAM:  load = TOP, type = ro, define = yes;
    PLAYER:   load = TOP, type = ro, define = yes;
    VECTORS:  load = TOP, type = ro, start = $FFFA;
}
