name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Formatting, typing and linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install system libraries
        run: python3 scripts/system_dependencies.py

      - name: Install the development environment
        run: uv sync --group dev

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run every pre-commit hook
        run: uv run pre-commit run --all-files --show-diff-on-failure --color always

      - name: Check the committed icons match the mark
        run: uv run pre-commit run icons --all-files --hook-stage pre-push --color always

  tests:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    env:
      PYTHON: ${{ matrix.os == 'windows-latest' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: python3 scripts/system_dependencies.py

      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 scripts/system_dependencies.py
          python3 scripts/build_environment.py >> "$GITHUB_ENV"

      - name: Install the development environment
        id: environment
        run: uv sync --group dev

      - name: Run the doctests
        shell: bash
        run: $PYTHON scripts/run_tests.py doctests

      - name: Run the test suite with coverage
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        shell: bash
        run: $PYTHON scripts/run_tests.py suite --workers auto

      - name: Run the benchmarks
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        shell: bash
        run: $PYTHON scripts/run_tests.py benchmarks
