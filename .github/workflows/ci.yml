name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Formatting, typing and linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install system libraries
        run: bash scripts/linux/build/dependencies.sh

      - name: Install the development environment
        run: uv sync --group dev

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run every pre-commit hook
        run: uv run pre-commit run --all-files --show-diff-on-failure --color always

      - name: Check the committed icons match the mark
        run: uv run pre-commit run icons --all-files --hook-stage pre-push --color always

  tests:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/linux/build/dependencies.sh

      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          bash scripts/macos/build/dependencies.sh
          bash scripts/macos/build/build_env.sh >> "$GITHUB_ENV"

      - name: Install the development environment
        run: uv sync --group dev

      - name: Run doctests
        run: uv run python -m pytest src/ --doctest-modules --no-cov

      - name: Run the unit and integration suites with coverage
        run: uv run python -m pytest -n auto --cov
