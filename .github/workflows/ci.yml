name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Formatting, typing and linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-tk

      - name: Install the development environment
        run: uv sync --group dev

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run every pre-commit hook
        run: uv run pre-commit run --all-files --show-diff-on-failure --color always

  tests:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-tk libgl1 libxrandr2 libxinerama1 libxcursor1 libxi6

      - name: Install the development environment
        run: uv sync --group dev

      - name: Run doctests
        run: uv run python -m pytest src/ --doctest-modules --no-cov

      - name: Run the unit and integration suites with coverage
        run: uv run python -m pytest -n auto --cov
