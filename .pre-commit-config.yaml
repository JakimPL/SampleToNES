repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types: [text]
        exclude: ^(LICENSE|THIRD-PARTY-LICENSES\.txt|src/sampletones_assets/fonts/LICENSES/)

      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        types: [text]
        exclude: ^(LICENSE|THIRD-PARTY-LICENSES\.txt|src/sampletones_assets/fonts/LICENSES/)

  - repo: https://github.com/timothycrosley/isort
    rev: 9.0.0a3
    hooks:
      - id: isort
        language_version: python3
        args: [
          "--profile", "black",
          "-l", "120"
        ]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3
        args: [
          "--line-length", "120"
        ]

  - repo: local
    hooks:
      - id: import-boundary
        name: import boundary
        entry: uv run scripts/checks/import_boundary.py --all
        language: system
        types: [python]
        pass_filenames: false
        verbose: true

      - id: unused-tags
        name: unused tags
        entry: uv run scripts/checks/unused_tags.py
        language: system
        types: [python]
        pass_filenames: false
        verbose: true

      - id: tag-names
        name: tag names
        entry: uv run scripts/checks/tag_names.py
        language: system
        types: [python]
        files: ^src/sampletones_application/tags/
        verbose: true

      - id: palette-colors
        name: palette colors
        entry: uv run scripts/checks/palette_colors.py
        language: system
        files: (^src/sampletones_application/.*\.py|^src/sampletones_config/.*\.yaml)$
        pass_filenames: false
        verbose: true

      - id: language-keys
        name: language keys
        entry: uv run scripts/checks/language_keys.py
        language: system
        files: (\.py|^src/sampletones_config/lang/.*\.yaml)$
        pass_filenames: false
        verbose: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        verbose: True
        require_serial: true
        exclude: ^(tests/)

      - id: pylint
        name: pylint
        entry: uv run pylint
        language: system
        types: [python]
        verbose: True
        require_serial: true
        exclude: ^(tests/)

      - id: pytest
        name: pytest
        entry: make test
        language: system
        types:
          - python
        stages:
          - pre-push
        pass_filenames: false
