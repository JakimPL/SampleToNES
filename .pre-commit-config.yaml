repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        types: [text]

  - repo: https://github.com/timothycrosley/isort
    rev: 6.0.1
    hooks:
      - id: isort
        language_version: python3
        args: [
          "--profile", "black",
          "-l", "120"
        ]

  - repo: https://github.com/ambv/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        args: [
          "--line-length", "120"
        ]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: make mypy
        language: system
        types: [python]
        verbose: True
        require_serial: true

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: make pylint
        language: system
        types: [python]
        verbose: True
        require_serial: true

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: make test
        language: system
        types:
          - python
        stages:
          - pre-push
        pass_filenames: false
