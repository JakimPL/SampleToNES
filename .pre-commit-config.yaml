repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types: [text]
        exclude: ^(LICENSE|THIRD-PARTY-LICENSES\.txt|src/sampletones_assets/fonts/LICENSES/)

      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        types: [text]
        exclude: ^(LICENSE|THIRD-PARTY-LICENSES\.txt|src/sampletones_assets/fonts/LICENSES/)

  - repo: https://github.com/timothycrosley/isort
    rev: 9.0.0a3
    hooks:
      - id: isort
        language_version: python3
        args: [
          "--profile", "black",
          "-l", "120"
        ]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3
        args: [
          "--line-length", "120"
        ]

  - repo: local
    hooks:
      - id: import-boundary
        name: import boundary
        entry: uv run sampletones check import-boundary --all
        language: system
        types: [python]
        pass_filenames: false
        verbose: true

      - id: unused-tags
        name: unused tags
        entry: uv run sampletones check unused-tags
        language: system
        types: [python]
        pass_filenames: false
        verbose: true

      - id: rendered-literals
        name: rendered literals
        entry: uv run sampletones check rendered-literals
        language: system
        files: ^tests/.*\.py$
        pass_filenames: false
        verbose: true

      - id: tag-names
        name: tag names
        entry: uv run sampletones check tag-names --all
        language: system
        types: [python]
        pass_filenames: false
        verbose: true

      - id: palette-colors
        name: palette colors
        entry: uv run sampletones check palette-colors
        language: system
        files: (^src/sampletones_application/.*\.py|^src/sampletones_config/.*\.yaml)$
        pass_filenames: false
        verbose: true

      - id: language-keys
        name: language keys
        entry: uv run sampletones check language-keys
        language: system
        files: (\.py|^src/sampletones_config/lang/.*\.yaml)$
        pass_filenames: false
        verbose: true

      - id: shortcut-actions
        name: shortcut actions
        entry: uv run sampletones check shortcut-actions
        language: system
        files: (\.py|^src/sampletones_config/keybindings/.*\.yaml)$
        pass_filenames: false
        verbose: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        verbose: True
        require_serial: true
        exclude: ^(tests/)

      - id: pylint
        name: pylint
        entry: uv run pylint
        language: system
        types: [python]
        verbose: True
        require_serial: true
        exclude: ^(tests/)

      - id: icons
        name: icons
        entry: uv run sampletones icons
        language: system
        files: ^src/(sampletones_assets/icons|sampletones_tools/assets/mark)/
        pass_filenames: false
        verbose: true
        stages:
          - pre-push

      - id: test
        name: test
        entry: make test
        language: system
        types:
          - python
        stages:
          - pre-push
        pass_filenames: false

      - id: test-docs
        name: test docs
        entry: make test-docs
        language: system
        files: ^src/.*\.py$
        stages:
          - pre-push
        pass_filenames: false

      - id: benchmarks
        name: benchmarks
        entry: make benchmarks
        language: system
        types:
          - python
        stages:
          - pre-push
        pass_filenames: false
