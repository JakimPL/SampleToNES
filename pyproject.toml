[project]
name = "sampletones"
version = "0.3.2"
description = "Approximate audio samples with the NES 2A03 oscillators and export them as FamiTracker instruments"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jakim (Stage Magician)", email = "jakimpl@gmail.com" }]
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
keywords = [
    "nes",
    "2a03",
    "famitracker",
    "chiptune",
    "audio",
    "resynthesis",
    "tracker",
    "dsp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Typing :: Typed",
]

dependencies = [
    "anytree>=2.12,<3",
    "dearpygui>=2.3,<3",
    "msgpack>=1.0,<2",
    "librosa>=0.11,<0.12",
    "numpy>=2.0,<3",
    "pebble>=5.0,<6",
    "pydantic>=2.9,<3",
    "pyaudio>=0.2.14,<0.3",
    "rich>=13.0,<16",
    "scipy>=1.13,<2",
    "screeninfo>=0.8,<0.9",
    "soundfile>=0.13,<0.14",
    "tqdm>=4.66,<5",
    "jeepney>=0.8,<1; sys_platform == 'linux'",
    "pytaskbar>=0.1.1,<0.2; platform_system == 'Windows'",
    "pywin32>=306; platform_system == 'Windows'",
    "PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/JakimPL/SampleToNES"
Repository = "https://github.com/JakimPL/SampleToNES"
Documentation = "https://github.com/JakimPL/SampleToNES/tree/main/docs"
Changelog = "https://github.com/JakimPL/SampleToNES/blob/main/CHANGELOG.md"
Issues = "https://github.com/JakimPL/SampleToNES/issues"

[project.scripts]
sampletones = "sampletones.__main__:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.21,<7"]
gpu = ["cupy-cuda12x[ctk]>=14,<15"]
gpu-cuda11 = [
    "cupy-cuda11x>=13,<14",
    "nvidia-cuda-runtime-cu11; sys_platform == 'linux'",
    "nvidia-cuda-nvrtc-cu11; sys_platform == 'linux'",
    "nvidia-cublas-cu11; sys_platform == 'linux'",
]

[dependency-groups]
assets = ["pillow>=11,<13"]
dev = [
    { include-group = "assets" },
    "black==26.5.1",
    "isort==8.0.1",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pylint==4.0.6",
    "pylint-pydantic==0.4.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "types-PyYAML==6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
conflicts = [[{ extra = "gpu" }, { extra = "gpu-cuda11" }]]

[tool.hatch.build.targets.wheel]
packages = [
    "src/sampletones",
    "src/sampletones_application",
    "src/sampletones_assets",
    "src/sampletones_config",
    "src/sampletones_core",
    "src/sampletones_shared",
    "src/sampletones_synthesis",
]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = [
    "sampletones",
    "sampletones_application",
    "sampletones_assets",
    "sampletones_config",
    "sampletones_core",
    "sampletones_shared",
    "sampletones_synthesis",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = [
    "sampletones_application",
    "sampletones_assets",
    "sampletones_core",
    "sampletones_shared",
    "sampletones_synthesis",
]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
python_version = "3.12"
files = [
    "src/sampletones",
    "src/sampletones_application",
    "src/sampletones_assets",
    "src/sampletones_core",
    "src/sampletones_shared",
    "src/sampletones_synthesis",
]
exclude = ["tests"]
disallow_subclassing_any = true
ignore_missing_imports = true
strict = true

[tool.pylint.main]
fail-under = 9.9
ignore-paths = "^tests/.*$"
load-plugins = ["pylint_pydantic"]

[tool.pylint.messages_control]
disable = [
    "import-outside-toplevel",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "too-few-public-methods",
    "too-many-ancestors",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-statements",
]

[tool.pylint.basic]
bad-names = ["foo", "baz"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.similarities]
min-similarity-lines = 5

[tool.pylint.typecheck]
ignored-modules = ["pydantic"]
