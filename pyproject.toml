[project]
name = "sampletones"
version = "0.3.0"
description = "SampleToNES ‒ Convert audio samples to FamiTracker instruments"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jakim / Stage Magician" }]

dependencies = [
    "anytree==2.13.0",
    "dearpygui==2.3.1",
    "msgpack==1.2.1",
    "librosa==0.11.0",
    "numpy==2.4.6",
    "pebble==5.2.0",
    "pydantic==2.13.4",
    "pyaudio==0.2.14",
    "rich==15.0.0",
    "scipy==1.18.0",
    "screeninfo==0.8.1",
    "tqdm==4.68.3",
    "pytaskbar==0.1.1; platform_system == 'Windows'",
    "pywin32==312; platform_system == 'Windows'",
    "PyYAML==6.0.3",
]

[project.scripts]
sampletones = "sampletones.__main__:main"

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=13,<14",
    "nvidia-cuda-runtime-cu12; sys_platform == 'linux'",
    "nvidia-cuda-nvrtc-cu12; sys_platform == 'linux'",
    "nvidia-cublas-cu12; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "import-linter>=2.13",
    "isort==8.0.1",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pylint==4.0.6",
    "pylint-pydantic==0.4.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/sampletones",
    "src/sampletones_application",
    "src/sampletones_assets",
    "src/sampletones_config",
    "src/sampletones_core",
    "src/sampletones_shared",
    "src/sampletones_synthesis",
]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = [
    "sampletones",
    "sampletones_application",
    "sampletones_assets",
    "sampletones_config",
    "sampletones_core",
    "sampletones_shared",
    "sampletones_synthesis",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = [
    "sampletones_application",
    "sampletones_core",
    "sampletones_shared",
    "sampletones_synthesis",
]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
python_version = "3.12"
files = [
    "src/sampletones",
    "src/sampletones_application",
    "src/sampletones_core",
    "src/sampletones_shared",
    "src/sampletones_synthesis",
]
exclude = ["tests"]
disallow_subclassing_any = true
ignore_missing_imports = true
strict = true
